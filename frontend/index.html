<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
  <link rel="stylesheet" href="./css/style.css">
  <title>Converse&Connect</title>
</head>
<body>
  <div class="app">
    <!-- Sidebar / Lista de conversas -->
    <aside class="sidebar conversations-view" id="conversationsView">
      <div class="sidebar__header">
        <div class="user-profile">
          <div class="avatar" id="currentUserAvatar"></div>
          <span id="currentUserName"></span>
        </div>
        <div class="sidebar__actions">
          <span class="material-symbols-outlined" id="settingsButton">settings</span>
        </div>
      </div>

      <div class="sidebar__search">
        <div class="search-wrapper">
          <input type="text" id="searchContacts" placeholder="Pesquisar amigos">
          <span class="material-symbols-outlined search-icon">search</span>
        </div>
      </div>

      <div class="sidebar__contacts" id="contactsList"></div>

      <div class="sidebar__global-search">
        <h4>Encontrar novos amigos</h4>
        <div class="search-wrapper">
          <input type="text" id="globalSearchInput" placeholder="Digite o nome do usuário">
          <span class="material-symbols-outlined search-icon" id="globalSearchButton">search</span>
        </div>
        <div id="globalSearchResults" class="global-search-results"></div>
      </div>

      <div class="sidebar__pending" id="pendingRequests">
        <h4>Pedidos de amizade</h4>
        <div id="pendingList"></div>
      </div>
    </aside>

    <!-- Área do chat -->
    <main class="chat-area chat-view" id="chatView">
      <header class="chat__header">
        <div class="chat__header-info">
          <button class="back-button" id="backButton" aria-label="Voltar para conversas">
            <span class="material-symbols-outlined">arrow_back</span>
          </button>
          <div class="avatar" id="chatHeaderAvatar"></div>
          <div>
            <h3 id="chatHeaderName">Selecione um amigo</h3>
            <span id="chatHeaderStatus">online</span>
          </div>
        </div>
        <div class="chat__header-actions">
          <span class="material-symbols-outlined" id="chatMenuButton">more_vert</span>
        </div>
      </header>

      <div class="chat__messages" id="chatMessages"></div>

      <div class="chat__input-area">
        <button class="attach-button" id="attachButton">
          <span class="material-symbols-outlined">attach_file</span>
        </button>
        <button class="emoji-button" id="emojiButton">
          <span class="material-symbols-outlined">sentiment_satisfied</span>
        </button>
        <form class="chat__form" id="chatForm">
          <input type="text" class="chat__input" id="chatInput" placeholder="Digite uma mensagem" autocomplete="off">
          <button type="submit" class="chat__button">
            <span class="material-symbols-outlined">send</span>
          </button>
        </form>
        <div class="emoji-picker" id="emojiPicker" style="display: none;"></div>
      </div>
    </main>
  </div>

  <!-- Modal de Configurações -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Configurações</h2>
        <span class="close-modal">&times;</span>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <label>Tema</label>
          <select id="themeSelect">
            <option value="dark">Escuro (padrão)</option>
            <option value="light">Claro</option>
          </select>
        </div>
        <div class="setting-item">
          <label>Notificações</label>
          <input type="checkbox" id="notificationsToggle" checked> <span>Ativar sons e notificações</span>
        </div>
        <div class="setting-item">
          <label>Exibir hora nas mensagens</label>
          <input type="checkbox" id="showTimeToggle" checked> <span>Sim</span>
        </div>
        <button id="clearHistoryBtn" class="danger-btn">Limpar histórico de todas as conversas</button>
        <hr style="margin: 20px 0; border-color: var(--border-color);">
        <button id="logoutBtn" class="danger-btn" style="background-color: #d32f2f;">Sair da conta</button>
      </div>
    </div>
  </div>

  <!-- Menus de contexto -->
  <div id="chatContextMenu" class="context-menu" style="display: none;">
    <ul>
      <li id="clearConversationBtn">Limpar conversa</li>
      <li id="blockUserBtn">Bloquear usuário</li>
      <li id="reportUserBtn">Denunciar</li>
    </ul>
  </div>

  <div id="messageContextMenu" class="context-menu" style="display: none;">
    <ul>
      <li id="replyMsgBtn">Responder</li>
      <li id="editMsgBtn">Editar</li>
      <li id="deleteMsgBtn">Excluir</li>
      <li id="reactMsgBtn">Reagir</li>
    </ul>
  </div>

  <div id="reactionPicker" class="reaction-picker" style="display: none;">
    <span>👍</span><span>❤️</span><span>😂</span><span>😮</span><span>😢</span><span>👎</span>
  </div>

  <input type="file" id="fileInput" style="display: none;" accept="image/*,video/*,application/pdf">
  <script src="./js/scripts.js"></script>
</body>
</html>
